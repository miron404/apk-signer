name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            # No secrets: mint a throwaway key so the release APK is a real release build that can
            # be installed and then re-signed by the app itself. It differs every run, so an
            # existing install has to be replaced rather than updated.
            echo "No signing secrets configured; generating a throwaway release key."
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            SIGNING_KEYSTORE_PASSWORD="$(head -c 24 /dev/urandom | base64)"
            SIGNING_KEY_ALIAS=ci
            SIGNING_KEY_PASSWORD="$SIGNING_KEYSTORE_PASSWORD"
            keytool -genkeypair \
              -keystore release.jks -storetype PKCS12 \
              -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SIGNING_KEYSTORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" \
              -dname "CN=APK Signer throwaway CI key, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"
            keytool -list -v -keystore release.jks -storepass "$SIGNING_KEYSTORE_PASSWORD" \
              | grep -i 'SHA256:' || true
          else
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > release.jks
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$SIGNING_KEYSTORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      # Built first so the signing round-trip test has a real APK to work on.
      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Label a throwaway-signed release
        if: env.RELEASE_SIGNED == 'false'
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do mv "$f" "${f%.apk}-cikey.apk"; done

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

  # Only the emulator can tell us whether Keymaster accepts the KeyGenParameterSpec this app
  # builds. StrongBox is absent there, so the fallback branch is what gets exercised.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # An auth-bound key cannot be created without a secure lock screen.
            adb shell locksettings set-pin 1234
            adb shell input keyevent 82
            adb logcat -c
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            echo "--- key generation timings ---"
            adb logcat -d -s ApkSignerTiming:I
            adb shell locksettings clear --old 1234

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
